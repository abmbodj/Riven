<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" style="overflow: visible;">
    <defs>
        <filter id="bloom-glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <linearGradient id="leafGradLeft" x1="100" y1="130" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7a9e72" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#7a9e72" stop-opacity="0.2" />
        </linearGradient>
        <linearGradient id="leafGradRight" x1="100" y1="130" x2="160" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7a9e72" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#7a9e72" stop-opacity="0.2" />
        </linearGradient>
    </defs>

    <g transform="translate(0, 0)">
        <!-- Base stem -->
        <path d="M 100 150 C 100 135 100 120 100 100" stroke="#7a9e72" stroke-width="3" stroke-linecap="round" />
        
        <!-- Inner Glowing Core / Seed -->
        <circle cx="100" cy="105" r="4.5" fill="#deb96a" filter="url(#bloom-glow)" />

        <!-- Left Blooming Leaf -->
        <path d="M 98 105 C 50 110 25 70 45 35 C 70 30 85 70 98 105" fill="url(#leafGradLeft)" stroke="#7a9e72" stroke-width="2" stroke-linejoin="round" />
        <!-- Left inner vein -->
        <path d="M 98 105 C 70 85 55 55 47 40" stroke="#7a9e72" stroke-width="1" stroke-opacity="0.5" />

        <!-- Right Blooming Leaf -->
        <path d="M 102 105 C 150 110 175 70 155 35 C 130 30 115 70 102 105" fill="url(#leafGradRight)" stroke="#7a9e72" stroke-width="2" stroke-linejoin="round" />
        <!-- Right inner vein -->
        <path d="M 102 105 C 130 85 145 55 153 40" stroke="#7a9e72" stroke-width="1" stroke-opacity="0.5" />

        <!-- Outer Left Leaf (lower) -->
        <path d="M 96 115 C 60 140 20 120 15 90 C 20 70 50 85 96 115" fill="#7a9e72" fill-opacity="0.25" stroke="#7a9e72" stroke-width="1.5" stroke-linejoin="round" />

        <!-- Outer Right Leaf (lower) -->
        <path d="M 104 115 C 140 140 180 120 185 90 C 180 70 150 85 104 115" fill="#7a9e72" fill-opacity="0.31" stroke="#7a9e72" stroke-width="1.5" stroke-linejoin="round" />

        <!-- Central Sprout / Pistil -->
        <path d="M 100 100 C 95 70 98 40 100 15 C 102 40 105 70 100 100" fill="#deb96a" fill-opacity="0.7" filter="url(#bloom-glow)" />
    </g>

    <!-- Motes -->
    <circle cx="95" cy="45" r="1.5" fill="#deb96a" filter="url(#bloom-glow)" opacity="0.8" />
    <circle cx="112" cy="65" r="2" fill="#deb96a" filter="url(#bloom-glow)" opacity="0.6" />
    <circle cx="82" cy="75" r="1.2" fill="#deb96a" filter="url(#bloom-glow)" opacity="0.9" />
    <circle cx="105" cy="30" r="1.8" fill="#deb96a" filter="url(#bloom-glow)" opacity="0.7" />

    <!-- Rings -->
    <circle cx="100" cy="95" r="70" fill="none" stroke="#deb96a" stroke-width="0.5" stroke-opacity="0.4" stroke-dasharray="1 12" />
    <circle cx="100" cy="95" r="55" fill="none" stroke="#7a9e72" stroke-width="0.5" stroke-opacity="0.5" stroke-dasharray="2 18" />
</svg>
