<svg xmlns="http://www.w3.org/2000/svg" width="120" height="140" viewBox="0 0 120 140">
  <!-- Flashcard base -->
  <rect x="20" y="50" width="80" height="80" rx="8" fill="#f5f0e8" opacity="0.95"/>
  <rect x="26" y="56" width="68" height="68" rx="5" fill="none" stroke="#c8a96e" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Plant stem -->
  <line x1="60" y1="50" x2="60" y2="15" stroke="#4a7c6f" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Left leaf -->
  <ellipse cx="48" cy="30" rx="12" ry="6" fill="#4a7c6f" transform="rotate(-35, 48, 30)"/>
  
  <!-- Right leaf -->
  <ellipse cx="72" cy="22" rx="12" ry="6" fill="#5a9c8a" transform="rotate(30, 72, 22)"/>
  
  <!-- Top bud -->
  <circle cx="60" cy="12" r="5" fill="#c8a96e" opacity="0.9"/>
  
  <!-- Card lines -->
  <line x1="34" y1="80" x2="86" y2="80" stroke="#1a2535" stroke-width="1.5" opacity="0.15"/>
  <line x1="34" y1="92" x2="72" y2="92" stroke="#1a2535" stroke-width="1.5" opacity="0.15"/>
  <line x1="34" y1="104" x2="80" y2="104" stroke="#1a2535" stroke-width="1.5" opacity="0.15"/>
</svg>
