name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (lint-free) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Production audit (report only)
        run: npm audit --omit=dev || true

  client:
    name: Client lint, test, build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      VITE_ENABLE_LEGACY_AUTH_BRIDGE: "false"
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint (must be error-free)
        run: npx eslint .
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Enforce production performance budgets
        run: npm run performance:budget
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Dashboard performance journeys
        run: npm run test:e2e
        env:
          # Shared GitHub VMs are not calibrated performance hardware. The
          # journeys still capture metrics/traces; controlled runs enforce gates.
          RIVEN_ENFORCE_PERFORMANCE_GATES: "false"
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-performance-traces
          path: |
            client/test-results
            client/playwright-report
      - name: Production audit (report only)
        run: npm audit --omit=dev || true

  edge-functions:
    name: Edge Function unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env _shared/*.test.ts

  database:
    name: Database migrations and pgTAP tests
    runs-on: ubuntu-latest
    env:
      RIVEN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      # Legacy production tables predate this repository's Phase 2 migration
      # history, so replay the dashboard RPC against its explicit contract schema.
      - name: Start isolated Supabase Postgres
        run: supabase db start --workdir supabase/tests/database/harness
      - name: Create dashboard test schema
        run: psql "$RIVEN_TEST_DATABASE_URL" --set ON_ERROR_STOP=on --file supabase/tests/database/fixtures/dashboard_bootstrap_schema.sql
      - name: Apply dashboard bootstrap migrations
        run: |
          psql "$RIVEN_TEST_DATABASE_URL" --set ON_ERROR_STOP=on --file supabase/migrations/20260729135957_dashboard_bootstrap_performance.sql
          psql "$RIVEN_TEST_DATABASE_URL" --set ON_ERROR_STOP=on --file supabase/migrations/20260729140055_dashboard_bootstrap_coalesce_fix.sql
          psql "$RIVEN_TEST_DATABASE_URL" --set ON_ERROR_STOP=on --file supabase/migrations/20260831055303_fix_dashboard_weekly_summary_contract.sql
      - name: Run dashboard pgTAP contract tests
        run: supabase test db --workdir supabase/tests/database/harness --db-url "$RIVEN_TEST_DATABASE_URL" supabase/tests/database/dashboard_bootstrap.test.sql

  rag-eval:
    name: RAG integration test + retrieval eval (recall@5 gate)
    runs-on: ubuntu-latest
    services:
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RAG_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/postgres
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Embeddings need a real key. Fork PRs don't get secrets, so they skip with a warning;
      # pushes to main must have it.
      - name: Check embedding key
        id: key
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "${{ github.event_name }}" = "push" ]; then echo "::error::GEMINI_API_KEY secret is required for the RAG eval"; exit 1; fi
          echo "::warning::GEMINI_API_KEY not available (fork PR); skipping RAG eval"
      - name: Integration test (ingest → retrieve → answer)
        if: steps.key.outputs.ok == 'true'
        run: deno test -A --node-modules-dir=auto supabase/tests/rag/
      # Threshold from the first eval run (recall@5 = 1.00 on 41 answerable questions, 2026-11-12):
      # 0.95 tolerates at most two misses before failing.
      - name: Retrieval eval (fails if recall@5 < 0.95)
        if: steps.key.outputs.ok == 'true'
        run: deno run -A --node-modules-dir=auto eval/run.ts --retrieval-only --min-recall5 0.95 --out eval/results/ci.json
