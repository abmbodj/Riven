name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (lint-free) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npx vitest run
      - name: Production audit (report only)
        run: npm audit --omit=dev || true

  client:
    name: Client lint, test, build
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-test-anon-key
      VITE_ENABLE_LEGACY_AUTH_BRIDGE: "false"
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Lint (must be error-free)
        run: npx eslint .
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      - name: Enforce production performance budgets
        run: npm run performance:budget
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Dashboard performance journeys
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-performance-traces
          path: |
            client/test-results
            client/playwright-report
      - name: Production audit (report only)
        run: npm audit --omit=dev || true

  edge-functions:
    name: Edge Function unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env _shared/*.test.ts

  database:
    name: Database migrations and pgTAP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - run: supabase db start
      - run: supabase test db
